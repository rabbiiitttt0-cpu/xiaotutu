# ===== 小图兔 生产编排（compose 项目名 -p xiaotutu，与同舟智航隔离）=====
services:
  db:
    image: postgres:16-alpine
    container_name: xiaotutu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    mem_limit: 512m          # 小库足够；不给多，避免跟 app 抢 2C4G
    expose:
      - "5432"               # 仅内网，不对外暴露
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: xiaotutu-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiaotutu-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    mem_limit: 3g          # 内存上限，OOM 只杀自己不拖垮别的服务
    expose:
      - "7780"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: xiaotutu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/www:/var/www/html:ro
    depends_on:
      - app
